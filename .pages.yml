media:
  input: static/img
  output: /img
content:
  - name: blog
    label: Blog
    path: content/blog
    type: collection
    format: toml
    fields:
      - name: title
        type: string
    view: 
      fields: [ title, date ]
      sort: [ date, title ]
      primary: title
      default:
        search: ''
        sort: title
        order: desc