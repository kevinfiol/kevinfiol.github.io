name: deploy
env:
  LUASMITH_VERSION: "0.10"
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tags:
        description: 'Description tag.'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and Run luasmith
        run: |
          wget "https://github.com/jaredkrinke/luasmith/releases/download/$LUASMITH_VERSION/luasmith-$LUASMITH_VERSION-linux-x86_64.tar.gz" -O luasmith.tar.gz
          tar -xf luasmith.tar.gz
          ./luasmith theme.lua
      - name: deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          single-commit: true
          git-config-email: <>
          branch: gh-pages 
          folder: public
